function place(i,x,y){let p=state.hand[i];if(paused||state.status!=='playing'||!valid(state.g,p,x,y)){tone('bad');return false}let r=apply(state.g,p,x,y),gain=shapes[p.id].p.length,t=performance.now();state.g=r.after;state.hand[i]=null;selected=-1;keyboard=false;if(r.f.n){state.combo++;state.miss=0;state.lines+=r.f.n;gain+=r.f.n*80+(r.f.n-1)*70+(state.combo-1)*35;let perfect=state.g.every(v=>v===-1);if(perfect)gain+=300;let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduce){r.f.cells.forEach(i=>{let x=X+i%8*S,y=Y+Math.floor(i/8)*S,k=r.b[i];fx.push({kind:'cell',x,y,k,t,life:240});for(let j=0;j<4;j++){let a=Math.random()*6.283,v=50+Math.random()*150;fx.push({kind:'particle',x:x+S/2,y:y+S/2,k,t,life:350+Math.random()*200,vx:Math.cos(a)*v,vy:Math.sin(a)*v-45})}});r.f.rows.forEach(i=>fx.push({kind:'wave',row:true,i,t,life:230}));r.f.cols.forEach(i=>fx.push({kind:'wave',row:false,i,t,life:230}))}banner={text:perfect?'Perfect!':state.combo>1?'Combo '+state.combo:r.f.n>1?'Amazing!':'Great!',gain,t};tone('clear')}else{if(++state.miss>=3){state.combo=0;state.miss=0}tone('place')}state.score+=gain;if(mode==='classic')best=Math.max(best,state.score);if(state.hand.every(p=>!p))state.hand=nextHand(state,mode);if(mode!=='classic'&&state.lines>=goal())state.status='win';else if(!state.hand.some(p=>p&&positions(state.g,p).length))state.status='over';update();let scoreEl=$('score');scoreEl.classList.remove('bump');void scoreEl.offsetWidth;scoreEl.classList.add('bump');save();frame();if(state.status!=='playing'){const s=state;setTimeout(()=>{if(s===state&&state.status!=='playing'&&!paused)show(state.status)},400)}return true}

cv.addEventListener('pointermove',move);function stop(e,cancel=false){if(!drag||drag.id!==e.pointerId)return;if(!cancel)move(e);let d=drag;drag=null;try{cv.releasePointerCapture(e.pointerId)}catch{}if(!cancel&&d.moved&&d.ok)place(d.i,d.x,d.y);else if(!cancel&&d.moved)tone('bad');frame()}cv.addEventListener('pointerup',e=>stop(e));cv.addEventListener('pointercancel',e=>stop(e,true));cv.addEventListener('lostpointercapture',e=>stop(e,true));
cv.addEventListener('keydown',e=>{if(paused||state.status!=='playing')return;if(['1','2','3'].includes(e.key)){let i=Number(e.key)-1;if(state.hand[i]){selected=i;kx=ky=0;keyboard=true;frame()}return}if(selected<0||!state.hand[selected]||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key))return;e.preventDefault();let s=shapes[state.hand[selected].id];if(e.key==='ArrowUp')ky--;if(e.key==='ArrowDown')ky++;if(e.key==='ArrowLeft')kx--;if(e.key==='ArrowRight')kx++;kx=Math.max(0,Math.min(8-s.w,kx));ky=Math.max(0,Math.min(8-s.h,ky));keyboard=true;if(e.key==='Enter'||e.key===' ')place(selected,kx,ky);frame()});
// Local-only convenience PIN. This is not an authentication boundary.
function xiPrivateOptions(fields, commit, theme='dark') {
  if(document.getElementById('xi-private-dialog'))return;
  const d=document.createElement('dialog');d.id='xi-private-dialog';
  d.setAttribute('aria-label','Tùy chỉnh riêng');
  const style=document.createElement('style');style.textContent=`#xi-private-dialog{box-sizing:border-box;position:fixed;inset:0;margin:auto;width:min(360px,calc(100vw - 32px));max-height:calc(100dvh - 36px);overflow:auto;padding:22px;border:1px solid #887b6155;border-radius:18px;background:var(--xi-private-bg);color:var(--xi-private-fg);font:15px/1.5 system-ui,sans-serif;box-shadow:0 18px 65px #0006;text-align:left}#xi-private-dialog::backdrop{background:#0009}#xi-private-dialog *{box-sizing:border-box}#xi-private-dialog h2{font:700 21px/1.3 system-ui;margin:0 0 8px}#xi-private-dialog p{margin:8px 0}#xi-private-dialog label{display:grid;gap:6px;margin:12px 0}#xi-private-dialog input{width:100%;min-height:46px;border:1px solid #a5a5a566;border-radius:10px;padding:10px 12px;background:var(--xi-private-input);color:inherit;font:inherit;user-select:text}#xi-private-dialog .xi-actions{display:flex;gap:8px;margin-top:16px}#xi-private-dialog button{flex:1;min-height:44px;border:1px solid #a5a5a566;border-radius:10px;background:var(--xi-private-input);color:inherit;font:600 15px system-ui;padding:8px}#xi-private-dialog button[type=submit]{background:var(--xi-private-accent);color:var(--xi-private-ink);border-color:transparent}#xi-private-dialog [role=alert]{min-height:1.5em;color:var(--xi-private-error);font-size:13px}#xi-private-dialog :focus-visible{outline:2px solid var(--xi-private-accent);outline-offset:2px}`;
  const palettes={dark:['#211e19','#f9efd9','#302a23','#e6c48d','#21190e','#ffb7a9'],blue:['#172d65','#fff','#233c78','#ffda80','#17234b','#ffb7a9'],light:['#f3f8fc','#18354a','#e5edf3','#315e83','#fff','#a52b2b'],forest:['#1a343b','#fff4dc','#26474b','#ffe1a0','#142b35','#ffb7a9']};
  (palettes[theme]||palettes.dark).forEach((v,i)=>d.style.setProperty('--xi-private-'+['bg','fg','input','accent','ink','error'][i],v));
  d.append(style);const form=document.createElement('form');form.noValidate=true;d.append(form);let unlocked=false;
  function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
  function render(){form.replaceChildren();form.append(element('h2','?'),element('p',unlocked?'Tùy chỉnh chỉ áp dụng cho dữ liệu cục bộ của trò chơi này.':'Nhập mã PIN để tiếp tục.'));const inputs=[];
    function field(label,id,type,value,min,max){const l=element('label',label),i=element('input');i.id=id;i.type=type;i.value=String(value??'');i.autocomplete='off';i.required=true;if(type==='password'){i.inputMode='numeric';i.maxLength=6}else{i.inputMode='numeric';i.min=String(min);i.max=String(max);i.step='1'}l.append(i);form.append(l);inputs.push(i);return i}
    if(!unlocked)field('Mã PIN','xi-private-pin','password','');else for(const f of fields)field(f.label,'xi-private-'+f.id,'number',f.value,f.min,f.max);
    const error=element('p');error.setAttribute('role','alert');form.append(error);const actions=element('div');actions.className='xi-actions';const cancel=element('button','Đóng');cancel.type='button';cancel.onclick=()=>d.close();const submit=element('button',unlocked?'Áp dụng':'Mở khóa');submit.type='submit';actions.append(cancel,submit);form.append(actions);
    form.onsubmit=e=>{e.preventDefault();if(!unlocked){if(inputs[0].value!=='040804'){error.textContent='Mã PIN không đúng.';inputs[0].value='';inputs[0].focus();return}unlocked=true;render();return}const values={};for(let i=0;i<fields.length;i++){const f=fields[i],raw=inputs[i].value,n=Number(raw);if(!/^\d+$/.test(raw)||!Number.isSafeInteger(n)||n<f.min||n>f.max){error.textContent='Giá trị không hợp lệ: '+f.label;inputs[i].focus();return}values[f.id]=n}try{const result=commit(values);if(result!==true){error.textContent=typeof result==='string'?result:'Không thể lưu thay đổi.';return}d.close()}catch{error.textContent='Không thể lưu thay đổi.'}};
    inputs[0]?.focus();
  }
  d.addEventListener('close',()=>{unlocked=false;d.remove()},{once:true});document.body.append(d);render();d.showModal();form.querySelector('input')?.focus();
}

const btn=(a,t,p=false)=>`<button data-a="${a}" class="${p?'primary':''}">${t}</button>`;function show(type){if(drag){let d=drag;drag=null;try{cv.releasePointerCapture(d.id)}catch{}}paused=true;$('overlay').hidden=false;let html;if(type==='menu')html='<div class="gold">✦</div><h2>BLOCK NOVA</h2>'+btn('classic','Classic',true)+btn('adventure','Adventure')+btn('weekly','Thử thách tuần')+btn('resume','Quay lại')+btn('xi-hub','Về sảnh Xi');else if(type==='settings')html='<h2>Cài đặt</h2>'+btn('sound','Âm thanh: '+(sound?'Bật':'Tắt'))+btn('confirm','Chơi lại')+btn('help','Cách chơi')+btn('xi-private','?')+btn('resume','Tiếp tục',true);else if(type==='help')html='<h2>Cách chơi</h2><p>Kéo khối vào bảng 8×8 hoặc chạm chọn rồi chạm ô đặt. Xóa hàng ngang hoặc dọc để ghi điểm. Duy trì combo bằng cách xóa hàng trong vòng ba lượt. Dùng hết ba khối để nhận bộ mới.</p>'+btn('settings','Quay lại',true);else if(type==='confirm')html='<h2>Chơi lại?</h2><p>Ván hiện tại sẽ được đặt lại.</p>'+btn('restart','Chơi lại',true)+btn('resume','Hủy');else html=`<h2>${type==='win'?'Hoàn thành!':'Game Over'}</h2><div class="gold">${state.score.toLocaleString('vi-VN')}</div><p>${mode==='classic'?'Kỷ lục: '+best:mode==='weekly'?'Tuần '+state.week:'Màn '+state.level}</p>`+btn(type==='win'&&mode==='adventure'?'next':'restart',type==='win'&&mode==='adventure'?'Màn tiếp theo':'Chơi lại',true)+btn('menu','Trang chủ');$('panel').innerHTML=html;frame()}
$('panel').onclick=e=>{let a=e.target.dataset.a;if(a==='xi-private'){xiPrivateOptions([{id:'score',label:'Điểm ván hiện tại',value:state.score,min:0,max:1000000000},...(mode==='classic'?[{id:'best',label:'Kỷ lục Classic',value:best,min:0,max:1000000000}]:[])],v=>{if(mode==='classic'&&v.best<v.score)return 'Kỷ lục phải lớn hơn hoặc bằng điểm hiện tại.';const old=state.score,oldBest=best;state.score=v.score;if(mode==='classic')best=v.best;save();try{if(JSON.parse(localStorage.getItem('xi:game:block-nova:'+mode)).score!==v.score||(mode==='classic'&&JSON.parse(localStorage.getItem('xi:game:block-nova:best'))!==best))throw Error()}catch{state.score=old;best=oldBest;save();return 'Không thể lưu điểm.'}update();return true},'blue');return}if(a==='xi-hub'){save();location.assign('../../');return}if(a==='classic'||a==='adventure'||a==='weekly')load(a);if(a==='resume'){paused=false;$('overlay').hidden=true;if(state.status!=='playing')show(state.status);frame()}if(a==='restart')load(mode,true,state.level);if(a==='next')load('adventure',true,state.level+1);if(a==='sound'){sound=!sound;save();show('settings')}if(['confirm','menu','help','settings'].includes(a))show(a)};$('home').onclick=()=>show('menu');$('settings').onclick=()=>show(state.status==='playing'?'settings':state.status);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state){save();if(drag){let d=drag;drag=null;try{cv.releasePointerCapture(d.id)}catch{}frame()}}});
function resize(){let d=Math.min(3,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);frame()}load('classic');resize();window.addEventListener('resize',resize);
})();</script></html>
