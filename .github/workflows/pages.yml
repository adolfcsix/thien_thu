name: Xi Foundation — Validate and Deploy
on:
  push:
    branches: [main, 'feat/multi-game-foundation']
    paths: ['Xi_Foundation_1_2_Web_Deploy.zip']
  pull_request:
    branches: [main]
    paths: ['Xi_Foundation_1_2_Web_Deploy.zip', '.github/workflows/pages.yml', 'tests/foundation-browser.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xi-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release archives
        run: |
          echo '45937a0558a252575e7a70aafe3837d317f2ef74b308485a389e15c416dd3ef9  Xi_Foundation_1_2_Web_Deploy.zip' | sha256sum -c -
          echo '29e827a34f4ac56c1d1341a69303367e497b78dc938ff0d9d9de5332c5132aa8  Thien_Thu_V9_0_Web_Deploy.zip' | sha256sum -c -
          mkdir -p site
          unzip -q Xi_Foundation_1_2_Web_Deploy.zip -d site
          test -f site/index.html
          test -f site/sw.js
          test -f site/games/legacy/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Acceptance — same-origin migration and offline
        run: python tests/foundation-browser.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        with:
          path: site
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
