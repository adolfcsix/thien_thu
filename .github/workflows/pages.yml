name: Xi Foundation — Validate and Deploy
on:
  push:
    branches: [main, 'feat/xi-save-hardening']
    paths: ['Xi_Foundation_1_6_Release_Candidate.zip', '.github/workflows/pages.yml', 'tests/release-preflight.py', 'README.md', 'tests/activation-barrier.py', 'updates/**', 'tests/feather-upgrade.py']
  pull_request:
    branches: [main]
    paths: ['Xi_Foundation_1_6_Release_Candidate.zip', '.github/workflows/pages.yml', 'tests/release-preflight.py', 'README.md', 'tests/activation-barrier.py', 'updates/**', 'tests/feather-upgrade.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xi-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned candidate and original V9.0
        run: |
          echo 'd6c589a0990f005b27ec51c958ba2ec4588e320ed628640eabc4cdfbb87b2155  Xi_Foundation_1_6_Release_Candidate.zip' | sha256sum -c -
          echo '29e827a34f4ac56c1d1341a69303367e497b78dc938ff0d9d9de5332c5132aa8  Thien_Thu_V9_0_Web_Deploy.zip' | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build accepted baseline, personalization and Xi Universe lobby
        run: |
          python3 updates/feather-fury/build.py candidate
          python3 candidate/tests/release-preflight.py Thien_Thu_V9_0_Web_Deploy.zip candidate.zip
          cp candidate.zip baseline-f17.zip
          python3 updates/private-options/apply.py candidate
          cp updates/private-options/personalization-ui.py candidate/tests/personalization-ui.py
          python3 updates/private-options/polish.py candidate
          python3 updates/lobby/apply.py candidate
          cp candidate.zip baseline-f19.zip
          python3 updates/shell-polish/apply.py candidate
          cp candidate.zip baseline-f110.zip
          python3 updates/liquid-surface/apply.py candidate
          cp candidate.zip baseline-f111.zip
          python3 updates/adaptive-layout/apply.py candidate
          cp candidate.zip baseline-f112.zip
          python3 updates/adaptive-devices/apply.py candidate
          cp candidate.zip baseline-f113.zip
          python3 updates/premium-interaction/apply.py candidate
          cp candidate.zip baseline-f114.zip
          python3 updates/smart-personalization/apply.py candidate
          cp candidate.zip baseline-f115.zip
          python3 updates/final-polish/apply.py candidate
          cp candidate.zip baseline-f116.zip
          python3 updates/offline-resilience/apply.py candidate
          cp candidate.zip baseline-f117.zip
          python3 updates/save-hardening/apply.py candidate
          python3 candidate/tests/release-preflight.py Thien_Thu_V9_0_Web_Deploy.zip candidate.zip
          sha256sum candidate.zip baseline-f17.zip baseline-f19.zip baseline-f110.zip baseline-f111.zip baseline-f112.zip baseline-f113.zip baseline-f114.zip baseline-f115.zip baseline-f116.zip baseline-f117.zip > candidate.sha256
      - name: Catalog and unit acceptance
        working-directory: candidate
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: UI acceptance (mock messaging)
        run: |
          python candidate/tests/ui.py
          python candidate/tests/imported-ui-mock.py
          python candidate/tests/imported-ui.py
          python candidate/tests/personalization-ui.py
          python candidate/tests/layout.py
      - uses: actions/upload-artifact@v4
        with:
          name: xi-verified-candidate
          path: |
            candidate.zip
            candidate.sha256
            baseline-f17.zip
            baseline-f19.zip
            baseline-f110.zip
            baseline-f111.zip
            baseline-f112.zip
            baseline-f113.zip
            baseline-f114.zip
            baseline-f115.zip
            baseline-f116.zip
            baseline-f117.zip
          if-no-files-found: error
  browser:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xi-verified-candidate
      - name: Verify and extract tested candidate
        run: |
          sha256sum -c candidate.sha256
          unzip -q candidate.zip -d candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install selected browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Synchronize natural activation in acceptance harness
        run: python tests/activation-barrier.py candidate/tests/browser.py
      - name: Real Service Worker acceptance
        run: |
          set -o pipefail
          python -u candidate/tests/browser.py --engine ${{ matrix.engine }} --site candidate/site --baseline Thien_Thu_V9_0_Web_Deploy.zip 2>&1 | tee browser-acceptance.log
      - name: F1.7 to F1.18 upgrade, offline personalization and recent play acceptance
        run: |
          set -o pipefail
          python -u updates/private-options/upgrade-ui.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f17.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.9 to F1.18 shell-only migration and startup acceptance
        run: |
          set -o pipefail
          python -u updates/shell-polish/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f19.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.10 to F1.18 glass preference and offline shell acceptance
        run: |
          set -o pipefail
          python -u updates/liquid-surface/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f110.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.11 to F1.18 adaptive layout and glass preference acceptance
        run: |
          set -o pipefail
          python -u updates/adaptive-layout/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f111.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.12 to F1.18 live rotation and surface tuning acceptance
        run: |
          set -o pipefail
          python -u updates/adaptive-devices/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f112.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.13 to F1.18 offline premium dialog and motion acceptance
        run: |
          set -o pipefail
          python -u updates/premium-interaction/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f113.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.14 to F1.18 offline favorites and profiles acceptance
        run: |
          set -o pipefail
          python -u updates/smart-personalization/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f114.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.15 to F1.18 offline detail, collections and atmosphere acceptance
        run: |
          set -o pipefail
          python -u updates/final-polish/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f115.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.16 to F1.18 cache-preserving migration
        run: |
          set -o pipefail
          python -u updates/offline-resilience/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f116.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.17 to F1.18 cache-preserving migration
        run: |
          set -o pipefail
          python -u updates/save-hardening/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f117.zip 2>&1 | tee -a browser-acceptance.log
      - name: Deleted origin, offline kit and real save export/import
        run: |
          set -o pipefail
          python -u updates/offline-resilience/origin-loss.py --engine ${{ matrix.engine }} --site candidate/site 2>&1 | tee -a browser-acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xi-acceptance-${{ matrix.engine }}
          path: browser-acceptance.log
          if-no-files-found: warn
  package:
    needs: [validate, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xi-verified-candidate
      - name: Verify and extract tested candidate
        run: |
          sha256sum -c candidate.sha256
          unzip -q candidate.zip -d candidate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: candidate/site
  deploy:
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
