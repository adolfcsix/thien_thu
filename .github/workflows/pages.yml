name: Xi Foundation — Validate and Deploy
on:
  push:
    branches: [main, 'feat/feather-fury-integration']
    paths: ['Xi_Foundation_1_6_Release_Candidate.zip', '.github/workflows/pages.yml', 'tests/release-preflight.py', 'README.md', 'tests/activation-barrier.py', 'updates/**', 'tests/feather-upgrade.py']
  pull_request:
    branches: [main]
    paths: ['Xi_Foundation_1_6_Release_Candidate.zip', '.github/workflows/pages.yml', 'tests/release-preflight.py', 'README.md', 'tests/activation-barrier.py', 'updates/**', 'tests/feather-upgrade.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xi-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned candidate and original V9.0
        run: |
          echo 'd6c589a0990f005b27ec51c958ba2ec4588e320ed628640eabc4cdfbb87b2155  Xi_Foundation_1_6_Release_Candidate.zip' | sha256sum -c -
          echo '29e827a34f4ac56c1d1341a69303367e497b78dc938ff0d9d9de5332c5132aa8  Thien_Thu_V9_0_Web_Deploy.zip' | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build F1.7 from verified F1.6 and original game source
        run: |
          python3 updates/feather-fury/build.py candidate
          python3 candidate/tests/release-preflight.py Thien_Thu_V9_0_Web_Deploy.zip candidate.zip
          sha256sum candidate.zip > candidate.sha256
      - name: Catalog and unit acceptance
        working-directory: candidate
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: UI acceptance (mock messaging)
        run: |
          python candidate/tests/ui.py
          python candidate/tests/imported-ui-mock.py
          python candidate/tests/imported-ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: xi-verified-candidate
          path: |
            candidate.zip
            candidate.sha256
          if-no-files-found: error
  browser:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xi-verified-candidate
      - name: Verify and extract tested candidate
        run: |
          sha256sum -c candidate.sha256
          unzip -q candidate.zip -d candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install selected browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Synchronize natural activation in acceptance harness
        run: python tests/activation-barrier.py candidate/tests/browser.py
      - name: Real Service Worker acceptance
        run: |
          set -o pipefail
          python -u candidate/tests/browser.py --engine ${{ matrix.engine }} --site candidate/site --baseline Thien_Thu_V9_0_Web_Deploy.zip 2>&1 | tee browser-acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xi-acceptance-${{ matrix.engine }}
          path: browser-acceptance.log
          if-no-files-found: warn
  package:
    needs: [validate, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xi-verified-candidate
      - name: Verify and extract tested candidate
        run: |
          sha256sum -c candidate.sha256
          unzip -q candidate.zip -d candidate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: candidate/site
  deploy:
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
