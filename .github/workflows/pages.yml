name: Xi Foundation — Validate and Deploy
on:
  push:
    branches: [main, 'feat/multi-game-foundation']
    paths: ['Xi_Foundation_1_5_Release_Candidate.zip', '.github/workflows/pages.yml', 'tests/release-preflight.py']
  pull_request:
    branches: [main]
    paths: ['Xi_Foundation_1_5_Release_Candidate.zip', '.github/workflows/pages.yml', 'tests/release-preflight.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xi-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned candidate and original V9.0
        run: |
          echo '3fda3e016636dc6f1fcf3a9cf607e6b97b5109d3d0dd15d363bc011ba100f666  Xi_Foundation_1_5_Release_Candidate.zip' | sha256sum -c -
          echo '29e827a34f4ac56c1d1341a69303367e497b78dc938ff0d9d9de5332c5132aa8  Thien_Thu_V9_0_Web_Deploy.zip' | sha256sum -c -
          python3 tests/release-preflight.py Thien_Thu_V9_0_Web_Deploy.zip Xi_Foundation_1_5_Release_Candidate.zip
          mkdir candidate
          unzip -q Xi_Foundation_1_5_Release_Candidate.zip -d candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Catalog and unit acceptance
        working-directory: candidate
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: UI acceptance (mock messaging)
        run: python candidate/tests/ui.py
      - name: Real Service Worker — Chromium
        run: python candidate/tests/browser.py --engine chromium --site candidate/site --baseline Thien_Thu_V9_0_Web_Deploy.zip
      - name: Real Service Worker — WebKit
        run: python candidate/tests/browser.py --engine webkit --site candidate/site --baseline Thien_Thu_V9_0_Web_Deploy.zip
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        with:
          path: candidate/site
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
