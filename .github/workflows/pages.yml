name: Xi Foundation — Validate and Deploy
on:
  push:
    branches: [main, 'feat/xi-feather-141']
    paths: ['Xi_Foundation_1_6_Release_Candidate.zip', '.github/workflows/pages.yml', 'tests/release-preflight.py', 'README.md', 'tests/activation-barrier.py', 'updates/**', 'tests/feather-upgrade.py']
  pull_request:
    branches: [main]
    paths: ['Xi_Foundation_1_6_Release_Candidate.zip', '.github/workflows/pages.yml', 'tests/release-preflight.py', 'README.md', 'tests/activation-barrier.py', 'updates/**', 'tests/feather-upgrade.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xi-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned candidate and original V9.0
        run: |
          echo 'd6c589a0990f005b27ec51c958ba2ec4588e320ed628640eabc4cdfbb87b2155  Xi_Foundation_1_6_Release_Candidate.zip' | sha256sum -c -
          echo '29e827a34f4ac56c1d1341a69303367e497b78dc938ff0d9d9de5332c5132aa8  Thien_Thu_V9_0_Web_Deploy.zip' | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build accepted baseline, personalization and Xi Universe lobby
        run: |
          python3 updates/feather-fury/build.py candidate
          python3 candidate/tests/release-preflight.py Thien_Thu_V9_0_Web_Deploy.zip candidate.zip
          cp candidate.zip baseline-f17.zip
          python3 updates/private-options/apply.py candidate
          cp updates/private-options/personalization-ui.py candidate/tests/personalization-ui.py
          python3 updates/private-options/polish.py candidate
          python3 updates/lobby/apply.py candidate
          cp candidate.zip baseline-f19.zip
          python3 updates/shell-polish/apply.py candidate
          cp candidate.zip baseline-f110.zip
          python3 updates/liquid-surface/apply.py candidate
          cp candidate.zip baseline-f111.zip
          python3 updates/adaptive-layout/apply.py candidate
          cp candidate.zip baseline-f112.zip
          python3 updates/adaptive-devices/apply.py candidate
          cp candidate.zip baseline-f113.zip
          python3 updates/premium-interaction/apply.py candidate
          cp candidate.zip baseline-f114.zip
          python3 updates/smart-personalization/apply.py candidate
          cp candidate.zip baseline-f115.zip
          python3 updates/final-polish/apply.py candidate
          cp candidate.zip baseline-f116.zip
          python3 updates/offline-resilience/apply.py candidate
          cp candidate.zip baseline-f117.zip
          python3 updates/save-hardening/apply.py candidate
          cp candidate.zip baseline-f118.zip
          echo 'def37b93bf2a0938fa9b5c02a8c849e30184838719a6ec5541459cc760f03eed  updates/feather-122/original.html' | sha256sum -c -
          python3 updates/feather-122/apply.py candidate updates/feather-122/original.html
          echo '1ea64b289da8cb5a42bf30e54c654a735731b6182a55a76b13ebbb0acbb6b7d7  candidate/site/games/feather-fury/index.html' | sha256sum -c -
          cp candidate.zip baseline-f119.zip
          python3 updates/feather-141/apply.py candidate
          echo '083f61d8f7121e7bfb57064bb4363699c1cc9b5d8bd1ae7f3a518b4288e2b63a  candidate/site/games/feather-fury/index.html' | sha256sum -c -
          python3 candidate/tests/release-preflight.py Thien_Thu_V9_0_Web_Deploy.zip candidate.zip
          sha256sum candidate.zip baseline-f17.zip baseline-f19.zip baseline-f110.zip baseline-f111.zip baseline-f112.zip baseline-f113.zip baseline-f114.zip baseline-f115.zip baseline-f116.zip baseline-f117.zip baseline-f118.zip baseline-f119.zip > candidate.sha256
      - name: Catalog and unit acceptance
        working-directory: candidate
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: UI acceptance (mock messaging)
        run: |
          python candidate/tests/ui.py
          python candidate/tests/imported-ui-mock.py
          python candidate/tests/imported-ui.py
          python candidate/tests/personalization-ui.py
          python candidate/tests/layout.py
      - name: Integrate and verify F1.24 six-game release
        run: |
          python3 updates/six-games/apply.py candidate release
          python3 updates/six-games/freeze.py release
          sha256sum release.zip > release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: xi-verified-candidate
          path: |
            candidate.zip
            candidate.sha256
            release.zip
            release.sha256
            baseline-f17.zip
            baseline-f19.zip
            baseline-f110.zip
            baseline-f111.zip
            baseline-f112.zip
            baseline-f113.zip
            baseline-f114.zip
            baseline-f115.zip
            baseline-f116.zip
            baseline-f117.zip
            baseline-f118.zip
            baseline-f119.zip
          if-no-files-found: error
  browser:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xi-verified-candidate
      - name: Verify and extract tested candidate
        run: |
          sha256sum -c candidate.sha256
          unzip -q candidate.zip -d candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install selected browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Synchronize natural activation in acceptance harness
        run: python tests/activation-barrier.py candidate/tests/browser.py
      - name: Real Service Worker acceptance
        run: |
          set -o pipefail
          python -u candidate/tests/browser.py --engine ${{ matrix.engine }} --site candidate/site --baseline Thien_Thu_V9_0_Web_Deploy.zip 2>&1 | tee browser-acceptance.log
      - name: F1.7 to F1.20 upgrade, offline personalization and recent play acceptance
        run: |
          set -o pipefail
          python -u updates/private-options/upgrade-ui.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f17.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.9 to F1.20 shell-only migration and startup acceptance
        run: |
          set -o pipefail
          python -u updates/shell-polish/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f19.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.10 to F1.20 glass preference and offline shell acceptance
        run: |
          set -o pipefail
          python -u updates/liquid-surface/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f110.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.11 to F1.20 adaptive layout and glass preference acceptance
        run: |
          set -o pipefail
          python -u updates/adaptive-layout/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f111.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.12 to F1.20 live rotation and surface tuning acceptance
        run: |
          set -o pipefail
          python -u updates/adaptive-devices/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f112.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.13 to F1.20 offline premium dialog and motion acceptance
        run: |
          set -o pipefail
          python -u updates/premium-interaction/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f113.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.14 to F1.20 offline favorites and profiles acceptance
        run: |
          set -o pipefail
          python -u updates/smart-personalization/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f114.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.15 to F1.20 offline detail, collections and atmosphere acceptance
        run: |
          set -o pipefail
          python -u updates/final-polish/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f115.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.16 to F1.20 cache-preserving migration
        run: |
          set -o pipefail
          python -u updates/offline-resilience/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f116.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.17 to F1.20 cache-preserving migration
        run: |
          set -o pipefail
          python -u updates/save-hardening/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f117.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.18 to F1.20 FEATHER FURY 10.2 to 14.1 real migration
        run: |
          set -o pipefail
          python -u updates/feather-122/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f118.zip 2>&1 | tee -a browser-acceptance.log
      - name: F1.19 to F1.20 FEATHER FURY 12.2 to 14.1 real migration
        run: |
          set -o pipefail
          python -u updates/feather-141/upgrade.py --engine ${{ matrix.engine }} --site candidate/site --baseline baseline-f119.zip 2>&1 | tee -a browser-acceptance.log
      - name: Deleted origin, offline kit and real save export/import
        run: |
          set -o pipefail
          python -u updates/offline-resilience/origin-loss.py --engine ${{ matrix.engine }} --site candidate/site 2>&1 | tee -a browser-acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xi-acceptance-${{ matrix.engine }}
          path: browser-acceptance.log
          if-no-files-found: warn
  release-browser:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xi-verified-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install selected browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: F1.24 actual six-game release acceptance
        run: |
          set -o pipefail
          sha256sum -c release.sha256
          unzip -q release.zip -d release
          python3 release/tools/verify-source.py release
          python -u release/tests/browser.py --engine ${{ matrix.engine }} --site release/site 2>&1 | tee -a browser-acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xi-release-acceptance-${{ matrix.engine }}
          path: browser-acceptance.log
          if-no-files-found: warn
  package:
    needs: [validate, browser, release-browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xi-verified-candidate
      - name: Verify and extract tested candidate
        run: |
          sha256sum -c candidate.sha256
          unzip -q candidate.zip -d candidate
      - name: Extract verified six-game release
        run: |
          sha256sum -c release.sha256
          unzip -q release.zip -d release
      - run: python3 release/tools/verify-source.py release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/site
  deploy:
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  source-snapshot:
    needs: [validate, browser, release-browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xi-verified-candidate
      - name: Export independently buildable source branch
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c release.sha256
          mkdir canonical
          unzip -q release.zip -d canonical
          python3 canonical/tools/verify-source.py canonical
          branch="consolidation/f1.24-$(echo "$GITHUB_SHA" | cut -c1-12)"
          git config user.name "Xi release automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -f canonical
          git diff --cached --stat
          git commit -m "Consolidated six-game source verified at $GITHUB_SHA"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Snapshot branch already exists; refusing to overwrite"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$branch"
